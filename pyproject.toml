[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "google-maps-place-scout"
version = "1.0.0"
description = "Universal Google Maps Place Scout & Unidirectional Corridor Planner Skill"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "openpyxl>=3.0.0",
]

[project.scripts]
place-scout = "scripts.main:main"
restaurant-scout = "scripts.main:main"
